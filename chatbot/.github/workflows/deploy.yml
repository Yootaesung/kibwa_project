name: Deploy to EC2

# GitHub Actions 워크플로우
on:
  push:
    branches: [ main ]  # 또는 master

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        port: ${{ secrets.PORT || 22 }}
        script: |
          cd ~/deploy/chatbot
          git pull origin main  # 또는 master
          
          # Python 가상 환경 설정
          python3 -m venv venv
          source venv/bin/activate
          
          # 의존성 설치
          pip install -r requirements.txt
          
          # PM2로 앱 재시작
          pm2 delete chatbot || true
          pm2 start ecosystem.config.js
          
          # Nginx 설정 (필요한 경우)
          # sudo cp nginx/chatbot.conf /etc/nginx/sites-available/
          # sudo ln -sf /etc/nginx/sites-available/chatbot.conf /etc/nginx/sites-enabled/
          # sudo nginx -t && sudo systemctl restart nginx
