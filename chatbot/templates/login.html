<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 아이心터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e0e7ff; /* 연한 파란색 배경 */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .error-message {
            color: #ef4444; /* Tailwind red-500 */
            margin-top: 0.5rem; /* mt-2 */
            font-size: 0.875rem; /* text-sm */
        }
    </style>
</head>
<body class="antialiased">

    <div class="bg-white p-8 md:p-12 rounded-xl shadow-xl w-full max-w-md mx-4">

        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">로그인</h2>
        
        <form id="login-form" class="space-y-6" onsubmit="handleLogin(event)">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-2">아이디</label>
                <input type="text" id="username" name="username" required 
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm 
                              focus:ring-blue-500 focus:border-blue-500 text-base"
                       placeholder="아이디를 입력하세요">
                <div id="username-error" class="error-message"></div>
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">비밀번호</label>
                <input type="password" id="password" name="password" required 
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm 
                              focus:ring-blue-500 focus:border-blue-500 text-base"
                       placeholder="비밀번호를 입력하세요">
                <div id="password-error" class="error-message"></div>
            </div>
            
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" 
                           class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-900">
                        로그인 정보 기억하기
                    </label>
                </div>
                
                <div class="text-sm">
                    <a href="#" class="font-medium text-blue-600 hover:text-blue-500">
                        비밀번호를 잊으셨나요?
                    </a>
                </div>
            </div>
            
            <div>
                <button type="submit" id="login-button"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg 
                               shadow-sm text-lg font-bold text-white bg-blue-600 hover:bg-blue-700 
                               focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500
                               transition-colors transform hover:scale-105">
                    로그인
                </button>
            </div>
        </form>
        
        <div class="mt-8 text-center text-sm text-gray-600">
            계정이 없으신가요? 
            <a href="/register" class="font-medium text-blue-600 hover:text-blue-500">
                회원가입
            </a>
        </div>
        <div class="mt-4 text-center text-sm text-gray-600">
            <a href="/test" class="font-medium text-green-600 hover:text-green-500">
                테스트 하기
            </a>
        </div>
    </div>

    <script>
        function getBaseUrl() {
            return window.location.origin;
        }

        async function handleLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Clear previous errors
            document.getElementById('username-error').textContent = '';
            document.getElementById('password-error').textContent = '';
            
            // 로딩 상태 표시
            const loginButton = document.getElementById('login-button'); // Added ID to button
            const originalButtonText = loginButton.textContent;
            loginButton.disabled = true;
            loginButton.textContent = '로그인 중...';
            
            try {
                const response = await fetch(`${getBaseUrl()}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                let data;
                try {
                    data = await response.json();
                } catch (err) {
                    const text = await response.text();
                    throw new Error(`서버 응답 오류 (${response.status}): ${text}`);
                }

                if (response.ok && data.success) {
                    console.log('로그인 성공, 리다이렉트:', data.redirect_url);
                    // URL에서 next 파라미터 확인
                    const urlParams = new URLSearchParams(window.location.search);
                    const nextUrl = urlParams.get('next');
                    
                    // next 파라미터가 있으면 해당 URL로, 없으면 기본 URL로 이동
                    window.location.href = nextUrl || data.redirect_url || '/chat';
                } else {
                    const errorMessage = data.detail || data.message || '로그인에 실패했습니다. 다시 시도해주세요.';
                    
                    if (errorMessage.includes('존재하지') || errorMessage.includes('아이디') || errorMessage.includes('사용자')) {
                        document.getElementById('username-error').textContent = errorMessage;
                    } else {
                        document.getElementById('password-error').textContent = errorMessage;
                    }
                    
                    console.error('로그인 실패:', errorMessage);
                }
            } catch (error) {
                console.error('로그인 오류:', error);
                document.getElementById('password-error').textContent = 
                    error.message || '로그인 중 오류가 발생했습니다.';
            } finally {
                // 로딩 상태 해제
                loginButton.disabled = false;
                loginButton.textContent = originalButtonText;
            }
        }
    </script>
</body>
</html>
