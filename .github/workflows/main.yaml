name: Deploy FastAPI App to EC2

on:
  push:
    branches:
      - main

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  APP_DOCKER_IMAGE_NAME: impelfin/chatbot_app
  AWS_REGION: ap-northeast-2
  EC2_HOST: ${{ secrets.HOST }}
  EC2_USERNAME: ${{ secrets.USERNAME }}
  EC2_KEY: ${{ secrets.KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.APP_DOCKER_IMAGE_NAME }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USERNAME }}
          key: ${{ env.EC2_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            echo "--- Pulling Latest App Image ---"
            docker pull ${{ env.APP_DOCKER_IMAGE_NAME }}:latest
            
            echo "--- Stopping and Removing Old App Container ---"
            docker stop chatbot_app || true
            docker rm chatbot_app || true
            
            echo "--- Running New App Container ---"
            docker run -d \
              --restart always \
              --name chatbot_app \
              -p 8000:8000 \
              -v /path/to/chat_logs:/app/chat_logs \
              -v /path/to/emotion_data:/app/emotion_data \
              -v /path/to/member_information:/app/member_information \
              -v /path/to/profanity_data:/app/profanity_data \
              --network=host \
              ${{ env.APP_DOCKER_IMAGE_NAME }}:latest
            
            echo "--- Cleaning up unused Docker images ---"
            docker system prune -f
