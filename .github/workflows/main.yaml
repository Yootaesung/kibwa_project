name: Deploy Node.js MVC App to EC2

on:
  push:
    branches:
      - main

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  # Docker Hub 사용자명을 포함한 전체 이미지 경로 지정
  APP_DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/chatbot_app
  AWS_REGION: ap-southeast-2
  EC2_HOST: ${{ secrets.HOST }}
  EC2_USERNAME: ${{ secrets.USERNAME }}
  EC2_KEY: ${{ secrets.KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          # 로그인 확인을 위한 디버그 로그 추가
          verbose: true

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.APP_DOCKER_IMAGE_NAME }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USERNAME }}
          key: ${{ env.EC2_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            echo "--- Pulling Latest App Image ---"
            docker pull ${{ env.APP_DOCKER_IMAGE_NAME }}:latest
            
            echo "--- Stopping and Removing Old App Container ---"
            docker stop chatbot_app || true
            docker rm chatbot_app || true
            
            echo "--- Creating Required Directories ---"
            mkdir -p /home/ubuntu/chat_logs
            mkdir -p /home/ubuntu/emotion_data
            mkdir -p /home/ubuntu/member_information
            mkdir -p /home/ubuntu/profanity_data
            
            echo "--- Running New App Container ---"
            docker run -d \
              --restart always \
              --name chatbot_app \
              -p 8000:8000 \
              -v /home/ubuntu/chat_logs:/app/chat_logs \
              -v /home/ubuntu/emotion_data:/app/emotion_data \
              -v /home/ubuntu/member_information:/app/member_information \
              -v /home/ubuntu/profanity_data:/app/profanity_data \
              --network=host \
              ${{ env.APP_DOCKER_IMAGE_NAME }}:latest
            
            echo "--- Cleaning up unused Docker images ---"
            docker system prune -f
