name: Deploy Kibwa Chatbot to EC2

on:
  push:
    branches: [main]

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  APP_DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/kibwa-chatbot
  AWS_REGION: ap-southeast-2
  EC2_HOST: ${{ secrets.HOST }}
  EC2_USERNAME: ${{ secrets.USERNAME }}
  EC2_KEY: ${{ secrets.KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.APP_DOCKER_IMAGE_NAME }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USERNAME }}
          key: ${{ env.EC2_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            echo "--- Pulling Latest App Image ---"
            docker pull ${{ env.APP_DOCKER_IMAGE_NAME }}:latest
            
            echo "--- Stopping and Removing Old Container ---"
            docker stop chatbot_app || true
            docker rm chatbot_app || true
            
            echo "--- Running New Container ---"
            docker run -d \
              --name chatbot_app \
              --restart unless-stopped \
              -p 8000:8000 \
              -e KIBWA05_ACCESS_KEY_ID=${{ secrets.KIBWA05_ACCESS_KEY_ID }} \
              -e KIBWA05_SECRET_ACCESS_KEY=${{ secrets.KIBWA05_SECRET_ACCESS_KEY }} \
              -e KIBWA05_DEFAULT_REGION=ap-northeast-3 \
              -e KIBWA05_BUCKET=kibwa-05 \
              -e KIBWA05_PREFIX=project/ \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_DEFAULT_REGION=ap-southeast-2 \
              -e TEST_BUCKET=kibwa-12 \
              -e TEST_PREFIX=project/ \
              -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
              ${{ env.APP_DOCKER_IMAGE_NAME }}:latest
            
            echo "--- Container Status ---"
            docker ps -a
            
            echo "--- Cleaning up ---"
            docker system prune -f