name: Deploy Node.js MVC App to EC2

on:
  push:
    branches:
      - main

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  # Docker Hub 사용자명을 포함한 전체 이미지 경로 지정
  APP_DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/chatbot_app

  AWS_REGION: ap-southeast-2
  EC2_HOST: ${{ secrets.HOST }}
  EC2_USERNAME: ${{ secrets.USERNAME }}
  EC2_KEY: ${{ secrets.KEY }}
  
  # KIBWA05 S3 버킷 접근을 위한 환경 변수
  KIBWA05_ACCESS_KEY_ID: ${{ secrets.KIBWA05_ACCESS_KEY_ID }}
  KIBWA05_SECRET_ACCESS_KEY: ${{ secrets.KIBWA05_SECRET_ACCESS_KEY }}
  KIBWA05_DEFAULT_REGION: ${{ env.AWS_DEFAULT_REGION }}
  
  # 기본 AWS S3 버킷 접근을 위한 환경 변수
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ env.AWS_DEFAULT_REGION }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          # 로그인 확인을 위한 디버그 로그 추가
          verbose: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.APP_DOCKER_IMAGE_NAME }}:latest
          # 캐시 제거
          no-cache: true
          # 빌드 인자로 환경 변수 전달
          build-args: |
            KIBWA05_ACCESS_KEY_ID=${{ env.KIBWA05_ACCESS_KEY_ID }}
            KIBWA05_SECRET_ACCESS_KEY=${{ env.KIBWA05_SECRET_ACCESS_KEY }}
            KIBWA05_DEFAULT_REGION=${{ env.KIBWA05_DEFAULT_REGION }}
            AWS_ACCESS_KEY_ID=${{ env.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ env.AWS_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION=${{ env.AWS_DEFAULT_REGION }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USERNAME }}
          key: ${{ env.EC2_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            echo "--- Pulling Latest App Image ---"
            docker pull ${{ env.APP_DOCKER_IMAGE_NAME }}:latest
            
            echo "--- Stopping and Removing Old App Container ---"
            docker stop chatbot_app || true
            docker rm chatbot_app || true
            
            echo "--- Running New App Container ---"
            docker run -d \
              --restart always \
              --name chatbot_app \
              -p 8000:8000 \
              -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
              -e KIBWA05_ACCESS_KEY_ID=${{ secrets.KIBWA05_ACCESS_KEY_ID }} \
              -e KIBWA05_SECRET_ACCESS_KEY=${{ secrets.KIBWA05_SECRET_ACCESS_KEY }} \
              -e KIBWA05_DEFAULT_REGION=${{ secrets.KIBWA05_DEFAULT_REGION }} \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }} \
              --network=host \
              ${{ env.APP_DOCKER_IMAGE_NAME }}:latest
            
            echo "--- Cleaning up unused Docker images ---"
            docker system prune -f
