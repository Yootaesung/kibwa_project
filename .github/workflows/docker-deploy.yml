name: Docker Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: ./chatbot
        file: ./chatbot/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/kibwa-chatbot:latest
        build-args: |
          BUILDKIT_INLINE_CACHE=1

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        port: ${{ secrets.PORT || 22 }}
        script: |
          set -e
          echo "=== Starting deployment ==="
          
          # 필요한 디렉토리 생성
          mkdir -p ~/deploy
          cd ~/deploy
          echo "Current directory: $(pwd)"
          
          # 저장소 클론 또는 업데이트
          if [ ! -d "kibwa_project" ]; then
            git clone https://github.com/Yootaesung/kibwa_project.git
          fi
          
          cd kibwa_project
          git fetch origin
          git reset --hard origin/main
          
          # Docker Compose 파일 수정 (버전 필드 제거)
          cd chatbot
          if grep -q "^version:" docker-compose.yml; then
            sed -i '/^version:/d' docker-compose.yml
            echo "Removed version field from docker-compose.yml"
          fi
          
          # Docker 서비스 재시작
          echo "Restarting Docker services..."
          sudo systemctl restart docker
          
          # Docker Compose로 서비스 시작
          echo "Starting services with Docker Compose..."
          sudo docker-compose down
          sudo docker-compose pull
          sudo docker-compose up -d --build --remove-orphans
          
          # 컨테이너 상태 확인
          echo "Current containers status:"
          sudo docker ps -a
          
          echo "=== Deployment completed successfully ==="
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        port: ${{ secrets.PORT || 22 }}
        script: |
          # 도커 설치 (없는 경우)
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo systemctl enable docker
          
          # 도커 컴포즈 설치
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          
          # 도커 허브 로그인
          echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          
          # 프로젝트 디렉토리로 이동
          mkdir -p ~/deploy/kibwa_project
          cd ~/deploy/kibwa_project
          
          # 저장소 클론 (없는 경우)
          if [ ! -d "chatbot" ]; then
            git clone https://github.com/Yootaesung/kibwa_project.git .
          fi
          
          # 최신 코드 가져오기
          git pull origin main
          
          # 도커 컨테이너 실행
          cd chatbot
          sudo docker-compose down
          sudo docker-compose pull
          sudo docker-compose up -d
