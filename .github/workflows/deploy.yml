name: 🚀 Ultra Fast Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 🔍 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔐 Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 🏗️ Build & Push
        run: |
          IMAGE=${{ secrets.DOCKER_HUB_USERNAME }}/kibwa-chatbot:latest
          
          # Build and push in one step
          docker buildx build \
            --platform linux/amd64 \
            -t $IMAGE \
            --push \
            .

          
          # Deploy via SSH
          ssh -o "StrictHostKeyChecking=no" \
              -p ${{ secrets.PORT || '22' }} \
              ${{ secrets.USERNAME }}@${{ secrets.HOST }} "
            docker pull $IMAGE
            docker rm -f kibwa-chatbot 2>/dev/null || true
            docker run -d \
              --name kibwa-chatbot \
              -p 8000:8000 \
              --restart unless-stopped \
              -v /home/ubuntu/.aws:/root/.aws \
              $IMAGE
          "