name: Deploy to EC2

on:
  push:
    branches: [ main ]

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  APP_IMAGE: yootaesung/kibwa-chatbot

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKER_HUB_USERNAME }}
        password: ${{ env.DOCKER_HUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.APP_IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        port: ${{ secrets.PORT || '22' }}
        script: |
          echo "--- Pulling latest image ---"
          docker pull ${{ env.APP_IMAGE }}:latest || true
          
          echo "--- Stopping and removing old container ---"
          docker stop kibwa-chatbot || true
          docker rm kibwa-chatbot || true
          
          echo "--- Creating necessary directories ---"
          mkdir -p /work/kibwa_project/chatbot/member_information
          mkdir -p /work/kibwa_project/chatbot/emotion_data
          mkdir -p /work/kibwa_project/chatbot/profanity_data
          mkdir -p /work/kibwa_project/chatbot/chat_logs
          
          echo "--- Starting new container ---"
          cd /work/kibwa_project
          docker-compose -f docker-compose.prod.yml up -d
          
          echo "--- Cleaning up ---"
          docker system prune -f
          sudo mkdir -p /work/kibwa_project/chatbot/logs
          sudo mkdir -p /work/kibwa_project/chatbot/chat_logs
          
          echo "--- Setting permissions ---"
          sudo chown -R ${{ secrets.USERNAME }}:${{ secrets.USERNAME }} /work/kibwa_project
          
          echo "--- Starting new container ---"
          docker run -d \
            --name kibwa-chatbot \
            -p 8000:8000 \
            -v /work/kibwa_project/chatbot/member_information:/app/chatbot/member_information \
            -v /work/kibwa_project/chatbot/emotion_data:/app/chatbot/emotion_data \
            -v /work/kibwa_project/chatbot/profanity_data:/app/chatbot/profanity_data \
            -v /work/kibwa_project/chatbot/logs:/app/chatbot/logs \
            -v /work/kibwa_project/chatbot/chat_logs:/app/chatbot/chat_logs \
            --restart always \
            ${{ env.APP_IMAGE }}:latest
