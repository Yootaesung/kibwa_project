name: Deploy to EC2

on:
  push:
    branches: [main]

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  APP_DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/kibwa-chatbot
  EC2_HOST: ${{ secrets.HOST }}
  EC2_USERNAME: ${{ secrets.USERNAME }}
  EC2_KEY: ${{ secrets.KEY }}
  PORT: ${{ secrets.PORT || '22' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.APP_DOCKER_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        timeout-minutes: 15
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USERNAME }}
          key: ${{ env.EC2_KEY }}
          port: ${{ env.PORT }}
          script_stop: true
          script_timeout: '12m'
          script: |
            set -e
            echo "🚀 Starting deployment..."
            
            # Docker Hub 로그인
            echo "🔑 Logging in to Docker Hub..."
            echo ${{ secrets.DOCKER_HUB_TOKEN }} | docker login -u ${{ env.DOCKER_HUB_USERNAME }} --password-stdin || {
              echo "❌ Failed to login to Docker Hub"
              exit 1
            }
            
            # 기존 컨테이너 정리
            echo "🗑️ Cleaning up existing container..."
            docker stop kibwa-chatbot 2>/dev/null || echo "ℹ️ No running container to stop"
            docker rm kibwa-chatbot 2>/dev/null || echo "ℹ️ No container to remove"
            
            # 최신 이미지 가져오기
            echo "⬇️ Pulling latest image..."
            if ! docker pull ${{ env.APP_DOCKER_IMAGE_NAME }}:latest; then
              echo "❌ Failed to pull Docker image"
              exit 1
            fi
            
            # 새 컨테이너 실행
            echo "🚀 Starting new container..."
            if docker run -d \
              --name kibwa-chatbot \
              -p 8000:8000 \
              --restart unless-stopped \
              -v /home/ubuntu/.aws:/root/.aws \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }} \
              -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
              ${{ env.APP_DOCKER_IMAGE_NAME }}:latest; then
              
              echo "✅ Container started successfully!"
              echo "📊 Container status:"
              docker ps -f name=kibwa-chatbot --format "table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Ports}}"
            else
              echo "❌ Failed to start container"
              exit 1
            fi
            
            # 불필요한 이미지 정리 (오래된 이미지만 삭제)
            echo "🧹 Cleaning up unused Docker images..."
            docker system prune -f --filter "until=24h"
            
            echo "🎉 Deployment completed successfully! 🎉"