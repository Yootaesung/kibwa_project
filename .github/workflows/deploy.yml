name: Deploy Kibwa Chatbot to EC2 with Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  APP_DOCKER_IMAGE_NAME: kibwa/chatbot
  AWS_REGION: ap-northeast-2
  EC2_HOST: ${{ secrets.HOST }}
  EC2_USERNAME: ${{ secrets.USERNAME }}
  EC2_KEY: ${{ secrets.KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ env.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.APP_DOCKER_IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ env.EC2_HOST }}
        username: ${{ env.EC2_USERNAME }}
        key: ${{ env.EC2_KEY }}
        port: ${{ secrets.PORT || 22 }}
        script: |
          echo "=== Starting Docker Deployment ==="
          
          # Docker 설치 (아직 설치되지 않은 경우)
          if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y \
                  apt-transport-https \
                  ca-certificates \
                  curl \
                  gnupg \
                  lsb-release
              
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
              echo \
                "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu \
                $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io
              sudo usermod -aG docker $USER
          fi
          
          # Docker Compose 설치 (필요한 경우)
          if ! command -v docker-compose &> /dev/null; then
              echo "Installing Docker Compose..."
              sudo curl -L "https://github.com/docker/compose/releases/download/v2.15.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
          fi
          
          # Docker Hub 로그인
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          
          # 기존 컨테이너 중지 및 제거
          echo "Stopping and removing existing containers..."
          docker stop kibwa-chatbot || true
          docker rm kibwa-chatbot || true
          
          # 최신 Docker 이미지 가져오기
          echo "Pulling the latest Docker image..."
          docker pull ${{ env.DOCKERHUB_USERNAME }}/${{ env.APP_DOCKER_IMAGE_NAME }}:latest
          
          # 새 컨테이너 실행
          echo "Starting new container..."
          docker run -d \
            --name kibwa-chatbot \
            --restart unless-stopped \
            -p 8000:8000 \
            -v /etc/localtime:/etc/localtime:ro \
            -v /etc/timezone:/etc/timezone:ro \
            --memory="512m" \
            --cpus="0.5" \
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.APP_DOCKER_IMAGE_NAME }}:latest
          
          # 사용하지 않는 이미지 정리
          echo "Cleaning up unused Docker resources..."
          docker system prune -f
          
          echo "=== Deployment completed successfully ==="
