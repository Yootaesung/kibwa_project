name: Deploy to EC2

on:
  push:
    branches: [ main ]


env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  APP_IMAGE: yootaesung/kibwa-chatbot

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKER_HUB_USERNAME }}
        password: ${{ env.DOCKER_HUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.APP_IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        port: ${{ secrets.PORT || '22' }}
        script: |
          set -e  # 오류 발생 시 스크립트 중단
          
          # 배포 스크립트 다운로드 및 실행 권한 부여
          echo "--- Downloading deployment script ---"
          curl -o /tmp/deploy.sh https://raw.githubusercontent.com/${{ github.repository }}/main/deploy.sh
          chmod +x /tmp/deploy.sh
          
          # 환경 변수 설정
          export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${{ secrets.AWS_DEFAULT_REGION }}"
          export DOCKER_HUB_USERNAME="${{ secrets.DOCKER_HUB_USERNAME }}"
          export DOCKER_HUB_TOKEN="${{ secrets.DOCKER_HUB_TOKEN }}"
          
          # 배포 스크립트 실행
          echo "--- Starting deployment ---"
          /tmp/deploy.sh
          
          # 컨테이너 로그 확인
          echo "--- Container logs ---"
          docker logs kibwa-chatbot --tail 50 2>&1 || echo "No container logs available"
          
          # 디스크 사용량 확인
          echo "--- Disk usage ---"
          df -h
          
          echo "✅ Deployment completed successfully"
          sudo mkdir -p /work/kibwa_project/chatbot/logs
          sudo mkdir -p /work/kibwa_project/chatbot/chat_logs
          
          echo "--- Setting permissions ---"
          sudo chown -R ${{ secrets.USERNAME }}:${{ secrets.USERNAME }} /work/kibwa_project
          
          echo "--- Starting new container ---"
          docker run -d \
            --name kibwa-chatbot \
            -p 8000:8000 \
            -v /work/kibwa_project/chatbot/member_information:/app/chatbot/member_information \
            -v /work/kibwa_project/chatbot/emotion_data:/app/chatbot/emotion_data \
            -v /work/kibwa_project/chatbot/profanity_data:/app/chatbot/profanity_data \
            -v /work/kibwa_project/chatbot/logs:/app/chatbot/logs \
            -v /work/kibwa_project/chatbot/chat_logs:/app/chatbot/chat_logs \
            --restart always \
            ${{ env.APP_IMAGE }}:latest
