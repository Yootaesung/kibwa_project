version: '3.8'

services:
  kibwa-chatbot:
    image: ${DOCKER_HUB_USERNAME}/kibwa/chatbot:latest
    container_name: kibwa-chatbot
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./chatbot/member_information:/app/chatbot/member_information
      - ./chatbot/emotion_data:/app/chatbot/emotion_data
      - ./chatbot/profanity_data:/app/chatbot/profanity_data
    environment:
      - NODE_ENV=production
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
